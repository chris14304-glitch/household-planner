<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Household Planner</title>
<style>
  :root {
    --bg: #f6f3ee;
    --surface: #ffffff;
    --surface-2: #faf8f4;
    --ink: #2b2a27;
    --ink-soft: #6b675f;
    --line: #e4dfd5;
    --accent: #3f6f5e;
    --accent-soft: #e3eee8;
    --accent-ink: #ffffff;
    --warn: #b4513b;
    --today: #f3e6c8;
    --chip: #e8eef7;
    --chip-ink: #2f4f7a;
    --meal-b: #f6e7cf;
    --meal-l: #e1efe4;
    --meal-d: #e6e1f2;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1c1e; --surface: #242628; --surface-2: #2a2c2f; --ink: #ecebe8; --ink-soft: #a5a29b;
      --line: #393b3f; --accent: #7fb59f; --accent-soft: #2c3b35; --accent-ink: #14201b; --warn: #e08a73;
      --today: #4a4130; --chip: #2d3a4d; --chip-ink: #bcd2f0; --meal-b: #4a3d2a; --meal-l: #2e4234; --meal-d: #3a3450;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  button { font: inherit; cursor: pointer; }
  input, textarea, select { font: inherit; color: var(--ink); }

  /* ---------- Header & tabs ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
  .tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 10px; border: 1px solid var(--line); }
  .tab {
    border: 0; background: transparent; color: var(--ink-soft); padding: 7px 18px; border-radius: 7px; font-weight: 600;
  }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

  main { max-width: 1200px; margin: 0 auto; padding: 18px 16px 40px; }
  .panel { display: none; }
  .panel.active { display: flex; flex-direction: column; gap: 18px; }

  .top { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .top.single { grid-template-columns: 1fr; }
  @media (max-width: 760px) { .top { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px; min-width: 0;
  }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .card-head h2 { margin: 0; font-size: 17px; }
  .card-head .meta { color: var(--ink-soft); font-size: 13px; }

  /* ---------- Lists ---------- */
  .add-row { display: flex; gap: 8px; }
  .add-row input {
    flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2);
  }
  .add-row input:focus, .field input:focus, .field textarea:focus, .field select:focus {
    outline: 2px solid var(--accent); outline-offset: -1px; background: var(--surface);
  }
  .btn {
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink);
    padding: 8px 14px; border-radius: 9px; font-weight: 600; white-space: nowrap;
  }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .btn.danger { border-color: var(--warn); background: transparent; color: var(--warn); }
  .hint { color: var(--ink-soft); font-size: 12px; margin: 6px 2px 0; }

  ul.items {
    list-style: disc; margin: 10px 0 0; padding: 0 4px 0 22px;
    height: 260px; overflow-y: auto; border-top: 1px solid var(--line);
  }
  ul.items li { padding: 7px 0; border-bottom: 1px solid var(--line); }
  ul.items li::marker { color: var(--accent); }
  .item { display: flex; align-items: flex-start; gap: 8px; }
  .item input[type="checkbox"] { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
  .item .text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .item .del { border: 0; background: transparent; color: var(--ink-soft); font-size: 16px; line-height: 1; padding: 2px 4px; border-radius: 4px; }
  .item .del:hover { color: var(--warn); background: var(--surface-2); }
  li.done .text { text-decoration: line-through; color: var(--ink-soft); }
  .empty { list-style: none; color: var(--ink-soft); font-style: italic; border: 0 !important; margin-left: -22px; padding-top: 14px !important; }
  .list-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 13px; color: var(--ink-soft); }
  .linklike { border: 0; background: none; color: var(--accent); padding: 0; font-size: 13px; }

  /* ---------- Calendar ---------- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .cal-head h2 { margin: 0; font-size: 19px; min-width: 170px; }
  .cal-nav { display: flex; gap: 6px; }
  .icon-btn {
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
    width: 34px; height: 34px; border-radius: 9px; font-size: 18px; line-height: 1;
  }
  .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .dow { text-align: center; font-size: 12px; font-weight: 600; color: var(--ink-soft); padding: 4px 0; text-transform: uppercase; letter-spacing: .04em; }
  .day {
    min-height: 92px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px;
    padding: 5px 6px; text-align: left; display: flex; flex-direction: column; gap: 3px; color: var(--ink); overflow: hidden;
  }
  .day:hover { border-color: var(--accent); }
  .day.other { opacity: .45; }
  .day.today { background: var(--today); }
  .day .num { font-weight: 600; font-size: 13px; }
  .day.today .num { color: var(--accent); }
  .chip {
    font-size: 11.5px; background: var(--chip); color: var(--chip-ink); border-radius: 5px; padding: 1px 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chip.B { background: var(--meal-b); color: var(--ink); }
  .chip.L { background: var(--meal-l); color: var(--ink); }
  .chip.D { background: var(--meal-d); color: var(--ink); }
  .more { font-size: 11px; color: var(--ink-soft); }
  @media (max-width: 600px) {
    .day { min-height: 58px; padding: 4px; }
    .chip { font-size: 0; padding: 0; height: 6px; border-radius: 3px; background: var(--accent); }
    .chip.B, .chip.L, .chip.D { background: var(--accent); }
    .more { font-size: 10px; }
  }

  /* ---------- Modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(20,20,20,.45); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 50;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 14px; width: 100%; max-width: 560px; max-height: 90vh;
    display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.3); overflow: hidden;
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .modal-head h3 { margin: 0; font-size: 17px; }
  .close-x { border: 0; background: var(--surface-2); color: var(--ink); width: 34px; height: 34px; border-radius: 50%; font-size: 20px; line-height: 1; }
  .close-x:hover { background: var(--line); }
  .modal-body { overflow-y: auto; padding: 0 16px 16px; }
  .modal-actions { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }

  .hour { display: grid; grid-template-columns: 64px 1fr; border-bottom: 1px solid var(--line); min-height: 44px; }
  .hour .label { font-size: 12px; color: var(--ink-soft); padding-top: 6px; }
  .hour .slot { padding: 4px 0; display: flex; flex-direction: column; gap: 4px; }

  .event {
    background: var(--chip); color: var(--chip-ink); border-radius: 8px; padding: 6px 8px; display: flex; gap: 8px; align-items: flex-start;
  }
  .event .ev-main { flex: 1; min-width: 0; }
  .event .ev-title { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
  .event .ev-time { font-size: 12px; opacity: .8; }
  .event .ev-desc { font-size: 13px; margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
  .event .del { border: 0; background: transparent; color: inherit; opacity: .6; font-size: 16px; padding: 0 2px; }
  .event .del:hover { opacity: 1; color: var(--warn); }

  .meal { border-bottom: 1px solid var(--line); padding: 12px 0; }
  .meal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .meal-head h4 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .meal .event { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
  .meal-empty { color: var(--ink-soft); font-size: 13px; font-style: italic; }

  .form { display: none; padding: 14px 0 4px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .form.open { display: block; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .field input, .field textarea, .field select {
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); width: 100%;
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; }
  .check input { accent-color: var(--accent); }
  .err { color: var(--warn); font-size: 13px; min-height: 1em; margin: 0 0 6px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 9px; font-size: 14px;
    transition: .2s; pointer-events: none; z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Header extras ---------- */
  .header-right { display: flex; align-items: center; gap: 12px; }
  .sync { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); }
  .sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-soft); }
  .sync.live .dot { background: #4caf7a; }
  .sync.off .dot { background: var(--warn); }

  /* ---------- Sign-in ---------- */
  .login {
    position: fixed; inset: 0; background: var(--bg); z-index: 80;
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .login.open { display: flex; }
  .login-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    width: 100%; max-width: 380px; padding: 26px 24px 22px;
  }
  .login-card h1 { margin: 0 0 4px; font-size: 22px; }
  .login-card p.sub { margin: 0 0 18px; color: var(--ink-soft); font-size: 14px; }
  .login-card .btn { width: 100%; padding: 10px; margin-top: 4px; }
  .login-card .btn[disabled] { opacity: .6; cursor: wait; }
  .login-links { display: flex; justify-content: center; margin-top: 14px; }
  .msg { font-size: 13px; min-height: 1em; margin: 0 0 8px; color: var(--accent); }

  .loading { text-align: center; color: var(--ink-soft); padding: 40px 0; }
  main.hidden, header.hidden { display: none; }
</style>
<!-- Supabase client library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="hidden" id="appHeader">
  <div class="brand">Our Home</div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="household" aria-selected="true">Household</button>
    <button class="tab" role="tab" data-tab="meals" aria-selected="false">Meals</button>
    <a class="tab" href="finances.html">Finances</a>
  </div>
  <div class="header-right">
    <span class="sync" id="sync" title="Live sync status"><span class="dot"></span><span class="label">Connecting…</span></span>
    <button class="btn ghost small" id="signOutBtn">Sign out</button>
  </div>
</header>

<main class="hidden" id="appMain">
  <div class="loading" id="loading">Loading…</div>

  <!-- ===== HOUSEHOLD ===== -->
  <section class="panel" id="panel-household">
    <div class="top">
      <div class="card" data-list="todo" data-title="To-Do" data-placeholder="Add a to-do… (e.g. schedule pest control)"></div>
      <div class="card" data-list="house" data-title="House" data-placeholder="Add a house job… (e.g. fix kitchen leak)"></div>
    </div>
    <div class="card" data-calendar="household" data-mode="hours"></div>
  </section>

  <!-- ===== MEALS ===== -->
  <section class="panel" id="panel-meals">
    <div class="top single">
      <div class="card" data-list="grocery" data-title="Grocery" data-placeholder="Add groceries… (e.g. dishwasher pods, rinse aid)"></div>
    </div>
    <div class="card" data-calendar="meals" data-mode="meals"></div>
  </section>
</main>

<!-- ===== Sign-in screen ===== -->
<div class="login" id="login">
  <form class="login-card" id="loginForm">
    <h1>Our Home</h1>
    <p class="sub" id="loginSub">Sign in to see your lists and calendars.</p>
    <div class="field" id="emailField"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="email" required></div>
    <div class="field"><label for="loginPassword" id="pwLabel">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
    <p class="err" id="loginErr"></p>
    <p class="msg" id="loginMsg"></p>
    <button class="btn" type="submit" id="loginBtn">Sign in</button>
    <div class="login-links"><button type="button" class="linklike" id="forgotBtn">Forgot password?</button></div>
  </form>
</div>

<!-- ===== Day popup ===== -->
<div class="overlay" id="overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h3 id="modalTitle">Day</h3>
      <button class="close-x" id="closeModal" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ================= Supabase connection ================= */
  const SUPABASE_URL = "https://alzribqzvrcduelmlgcd.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Gt96Gaun8Caz_UHHUjfBWA_WIza7gpS"; // publishable key – safe in page code; RLS protects the data
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const LIST_TABLES = { todo: "todo_items", house: "house_items", grocery: "grocery_items" };
  const TABLE_TO_BUCKET = {
    todo_items: "todo", house_items: "house", grocery_items: "grocery",
    household_events: "events", meal_plans: "meals"
  };
  const MEAL_SLOTS = [
    { key: "B", type: "breakfast", name: "Breakfast", color: "var(--meal-b)" },
    { key: "L", type: "lunch",     name: "Lunch",     color: "var(--meal-l)" },
    { key: "D", type: "dinner",    name: "Dinner",    color: "var(--meal-d)" }
  ];

  // In-memory copy of the five tables
  const data = { todo: [], house: [], grocery: [], events: [], meals: [] };

  /* ================= Helpers ================= */
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const dateKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  function fmtTime(t) {
    if (!t) return "";
    const [h, m] = t.split(":").map(Number);
    return `${h % 12 === 0 ? 12 : h % 12}:${pad(m)} ${h >= 12 ? "PM" : "AM"}`;
  }
  const hourLabel = (h) => `${h % 12 === 0 ? 12 : h % 12} ${h >= 12 ? "PM" : "AM"}`;
  const byCreated = (a, b) => String(a.created_at).localeCompare(String(b.created_at));

  function upsert(arr, row) {
    const i = arr.findIndex(r => r.id === row.id);
    if (i >= 0) arr[i] = row; else arr.push(row);
  }

  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), 2200);
  }

  function prefGet(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
  function prefSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } }

  // Runs a Supabase write. On failure: tell the user and re-sync from the database.
  async function run(query, okMsg) {
    const { data: rows, error } = await query;
    if (error) {
      console.error(error);
      toast("Couldn't save: " + (error.message || "network error"));
      await loadAll();
      renderAll();
      return null;
    }
    if (okMsg) toast(okMsg);
    return rows || [];
  }

  /* ================= Load + live sync ================= */
  async function loadAll() {
    const tables = Object.keys(TABLE_TO_BUCKET);
    const results = await Promise.all(tables.map(t => sb.from(t).select("*")));
    results.forEach((res, i) => {
      if (res.error) { console.error(tables[i], res.error); toast("Couldn't load " + tables[i] + ": " + res.error.message); return; }
      data[TABLE_TO_BUCKET[tables[i]]] = res.data || [];
    });
  }

  let channel = null;
  function setSync(state, label) {
    const el = $("#sync");
    el.className = "sync " + state;
    $(".label", el).textContent = label;
  }
  function subscribe() {
    if (channel) sb.removeChannel(channel);
    channel = sb.channel("household-planner");
    Object.keys(TABLE_TO_BUCKET).forEach(table => {
      channel.on("postgres_changes", { event: "*", schema: "public", table }, payload => {
        const bucket = TABLE_TO_BUCKET[table];
        if (payload.eventType === "DELETE") {
          data[bucket] = data[bucket].filter(r => r.id !== payload.old.id);
        } else {
          upsert(data[bucket], payload.new);
        }
        renderBucket(bucket);
      });
    });
    channel.subscribe(status => {
      if (status === "SUBSCRIBED") setSync("live", "Live");
      else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") setSync("off", "Offline");
    });
  }

  // Phones drop the live connection when asleep, so re-sync when the page comes back.
  document.addEventListener("visibilitychange", async () => {
    if (!document.hidden && started) { await loadAll(); renderAll(); }
  });

  /* ================= Rendering hub ================= */
  function renderBucket(bucket) {
    if (LIST_TABLES[bucket]) {
      const card = document.querySelector(`[data-list="${bucket}"]`);
      if (card) renderList(card);
    } else if (bucket === "events") {
      renderCalendar(calendars.household);
      if (current && current.cal.mode === "hours" && !formOpen()) renderHours(false);
    } else if (bucket === "meals") {
      renderCalendar(calendars.meals);
      if (current && current.cal.mode === "meals" && !formOpen()) renderMeals();
    }
  }
  function renderAll() { Object.keys(data).forEach(renderBucket); }
  // Don't redraw the popup underneath someone who is typing in it
  const formOpen = () => !!document.querySelector("#modalBody .form.open");

  /* ================= Tabs ================= */
  function setTab(name) {
    prefSet("planner-tab", name);
    document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === name));
    document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + name));
  }
  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

  /* ================= Lists ================= */
  function parseLines(text) {
    return text.split(/\r?\n/).map(s => s.replace(/^\s*[-*•\d.)]+\s*/, "").trim()).filter(Boolean);
  }

  async function addItems(name, text, extra) {
    const lines = parseLines(text);
    if (!lines.length) return 0;
    const rows = await run(sb.from(LIST_TABLES[name]).insert(lines.map(t => Object.assign({ text: t }, extra || {}))).select());
    if (!rows) return 0;
    rows.forEach(r => upsert(data[name], r));
    renderBucket(name);
    return rows.length;
  }

  function buildList(card) {
    const name = card.dataset.list;
    const table = LIST_TABLES[name];
    card.innerHTML = `
      <div class="card-head"><h2>${esc(card.dataset.title)}</h2><span class="meta"></span></div>
      <form class="add-row">
        <input type="text" placeholder="${esc(card.dataset.placeholder)}" aria-label="New ${esc(card.dataset.title)} item">
        <button class="btn" type="submit">Add</button>
      </form>
      <p class="hint">Press Enter to add. Paste a list and each line becomes its own item.</p>
      <ul class="items"></ul>
      <div class="list-foot"><span></span><button class="linklike clear-done" type="button">Clear completed</button></div>`;

    const form = $("form", card), input = $("input", card);
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const text = input.value;
      if (!text.trim()) return;
      input.value = "";
      input.focus();
      await addItems(name, text);
    });
    input.addEventListener("paste", async e => {
      const txt = (e.clipboardData || window.clipboardData).getData("text");
      if (txt && /\n/.test(txt.trim())) {
        e.preventDefault();
        const n = await addItems(name, txt);
        if (n) toast(`Added ${n} items to ${card.dataset.title}`);
      }
    });
    $(".clear-done", card).addEventListener("click", async () => {
      const ids = data[name].filter(i => i.done).map(i => i.id);
      if (!ids.length) return;
      data[name] = data[name].filter(i => !i.done);
      renderList(card);
      await run(sb.from(table).delete().in("id", ids));
    });
    $("ul", card).addEventListener("click", async e => {
      const li = e.target.closest("li[data-id]");
      if (!li) return;
      const id = li.dataset.id;
      const item = data[name].find(i => i.id === id);
      if (!item) return;
      if (e.target.matches(".del")) {
        data[name] = data[name].filter(i => i.id !== id);
        renderList(card);
        await run(sb.from(table).delete().eq("id", id));
      } else if (e.target.matches("input[type=checkbox]")) {
        item.done = e.target.checked;
        renderList(card);
        await run(sb.from(table).update({ done: item.done }).eq("id", id));
      }
    });
    renderList(card);
  }

  function renderList(card) {
    const items = data[card.dataset.list].slice().sort(byCreated);
    const ul = $("ul", card);
    const open = items.filter(i => !i.done);
    const done = items.filter(i => i.done);
    $(".meta", card).textContent = `${open.length} open${done.length ? ` · ${done.length} done` : ""}`;
    $(".clear-done", card).style.visibility = done.length ? "visible" : "hidden";
    if (!items.length) { ul.innerHTML = `<li class="empty">Nothing here yet.</li>`; return; }
    ul.innerHTML = [...open, ...done].map(i => `
      <li data-id="${esc(i.id)}" class="${i.done ? "done" : ""}">
        <div class="item">
          <input type="checkbox" ${i.done ? "checked" : ""} aria-label="Mark done">
          <span class="text">${esc(i.text)}</span>
          <button class="del" type="button" aria-label="Delete">&times;</button>
        </div>
      </li>`).join("");
  }

  /* ================= Calendars ================= */
  const calendars = {};

  function buildCalendar(card) {
    const id = card.dataset.calendar;
    const now = new Date();
    const cal = { id, mode: card.dataset.mode, card, year: now.getFullYear(), month: now.getMonth() };
    calendars[id] = cal;

    card.innerHTML = `
      <div class="cal-head">
        <h2></h2>
        <div class="cal-nav">
          <button class="icon-btn prev" aria-label="Previous month">&#8249;</button>
          <button class="btn ghost small today-btn">Today</button>
          <button class="icon-btn next" aria-label="Next month">&#8250;</button>
        </div>
      </div>
      <div class="grid">${DOW.map(d => `<div class="dow">${d}</div>`).join("")}</div>
      <div class="grid days"></div>`;

    $(".prev", card).onclick = () => { cal.month--; if (cal.month < 0) { cal.month = 11; cal.year--; } renderCalendar(cal); };
    $(".next", card).onclick = () => { cal.month++; if (cal.month > 11) { cal.month = 0; cal.year++; } renderCalendar(cal); };
    $(".today-btn", card).onclick = () => { const n = new Date(); cal.year = n.getFullYear(); cal.month = n.getMonth(); renderCalendar(cal); };
    $(".days", card).addEventListener("click", e => {
      const d = e.target.closest(".day");
      if (d) openDay(cal, d.dataset.date);
    });
    renderCalendar(cal);
  }

  function chipsByDate(cal) {
    const map = {};
    if (cal.mode === "hours") {
      data.events.slice().sort((a, b) => String(a.start_time).localeCompare(String(b.start_time)))
        .forEach(e => (map[e.event_date] = map[e.event_date] || []).push({ cls: "", label: `${fmtTime(e.start_time)} ${e.title}` }));
    } else {
      MEAL_SLOTS.forEach(s => data.meals.filter(m => m.meal_type === s.type).sort(byCreated)
        .forEach(m => (map[m.meal_date] = map[m.meal_date] || []).push({ cls: s.key, label: `${s.key} · ${m.title}` })));
    }
    return map;
  }

  function renderCalendar(cal) {
    if (!cal) return;
    $("h2", cal.card).textContent = `${MONTHS[cal.month]} ${cal.year}`;
    const map = chipsByDate(cal);
    const first = new Date(cal.year, cal.month, 1);
    const start = new Date(cal.year, cal.month, 1 - first.getDay());
    const todayKey = dateKey(new Date());
    let html = "";
    for (let i = 0; i < 42; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      if (i === 35 && d.getMonth() !== cal.month) break;
      const key = dateKey(d);
      const items = map[key] || [];
      html += `
        <button class="day ${d.getMonth() !== cal.month ? "other" : ""} ${key === todayKey ? "today" : ""}" data-date="${key}"
          aria-label="${MONTHS[d.getMonth()]} ${d.getDate()}, ${items.length} item${items.length === 1 ? "" : "s"}">
          <span class="num">${d.getDate()}</span>
          ${items.slice(0, 3).map(it => `<span class="chip ${it.cls}">${esc(it.label)}</span>`).join("")}
          ${items.length > 3 ? `<span class="more">+${items.length - 3} more</span>` : ""}
        </button>`;
    }
    $(".days", cal.card).innerHTML = html;
  }

  /* ================= Day popup ================= */
  const overlay = $("#overlay"), body = $("#modalBody"), actions = $("#modalActions");
  let current = null; // { cal, key }

  function openDay(cal, key) {
    current = { cal, key };
    const [y, m, d] = key.split("-").map(Number);
    $("#modalTitle").textContent = new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
    if (cal.mode === "hours") renderHours(false); else renderMeals();
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
  }
  function closeDay() {
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden", "true");
    if (current) renderCalendar(current.cal);
    current = null;
  }
  $("#closeModal").onclick = closeDay;
  overlay.addEventListener("click", e => { if (e.target === overlay) closeDay(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && overlay.classList.contains("open")) closeDay(); });

  /* ---- Household: hour-by-hour ---- */
  function renderHours(openForm, presetHour) {
    const { key } = current;
    const events = data.events.filter(e => e.event_date === key)
      .sort((a, b) => String(a.start_time).localeCompare(String(b.start_time)));
    const preset = presetHour != null ? `${pad(presetHour)}:00` : "09:00";
    let html = `
      <form class="form ${openForm ? "open" : ""}" id="evForm">
        <div class="field"><label for="evTitle">Title</label><input id="evTitle" required placeholder="e.g. Vet – heartworm meds"></div>
        <div class="row2">
          <div class="field"><label for="evStart">Start time</label><input id="evStart" type="time" value="${preset}" required></div>
          <div class="field"><label for="evEnd">End time (optional)</label><input id="evEnd" type="time"></div>
        </div>
        <div class="field"><label for="evDesc">Description</label><textarea id="evDesc" placeholder="Details, address, who's going…"></textarea></div>
        <p class="err" id="evErr"></p>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button type="button" class="btn ghost" id="evCancel">Cancel</button>
          <button type="submit" class="btn" id="evSave">Save event</button>
        </div>
      </form>`;
    for (let h = 0; h < 24; h++) {
      const inHour = events.filter(e => Number(String(e.start_time).slice(0, 2)) === h);
      html += `<div class="hour" id="h${h}"><div class="label">${hourLabel(h)}</div><div class="slot" data-hour="${h}">
        ${inHour.map(e => `
          <div class="event" data-id="${esc(e.id)}">
            <div class="ev-main">
              <div class="ev-title">${esc(e.title)}</div>
              <div class="ev-time">${fmtTime(e.start_time)}${e.end_time ? " – " + fmtTime(e.end_time) : ""}</div>
              ${e.description ? `<div class="ev-desc">${esc(e.description)}</div>` : ""}
            </div>
            <button class="del" aria-label="Delete event">&times;</button>
          </div>`).join("")}
      </div></div>`;
    }
    body.innerHTML = html;
    actions.innerHTML = `<button class="btn" id="addEv">+ Add event</button>`;

    $("#addEv").onclick = () => renderHours(true);
    $("#evCancel").onclick = () => renderHours(false);
    $("#evForm").onsubmit = async e => {
      e.preventDefault();
      const title = $("#evTitle").value.trim(), start = $("#evStart").value, end = $("#evEnd").value;
      if (!title || !start) { $("#evErr").textContent = "Add a title and a start time."; return; }
      if (end && end <= start) { $("#evErr").textContent = "End time needs to be after the start time."; return; }
      $("#evSave").disabled = true;
      const rows = await run(sb.from("household_events").insert({
        event_date: key, title, start_time: start, end_time: end || null,
        description: $("#evDesc").value.trim() || null
      }).select(), "Event added");
      if (!rows) { const b = $("#evSave"); if (b) b.disabled = false; return; }
      rows.forEach(r => upsert(data.events, r));
      renderCalendar(current.cal);
      renderHours(false);
      const target = $("#h" + Number(start.slice(0, 2)));
      if (target) target.scrollIntoView({ block: "center" });
    };
    body.querySelectorAll(".slot").forEach(slot => slot.addEventListener("dblclick", ev => {
      if (ev.target === slot) renderHours(true, Number(slot.dataset.hour));
    }));
    body.querySelectorAll(".event .del").forEach(btn => btn.onclick = async () => {
      const id = btn.closest(".event").dataset.id;
      data.events = data.events.filter(x => x.id !== id);
      renderHours(false);
      renderCalendar(current.cal);
      await run(sb.from("household_events").delete().eq("id", id));
    });

    if (openForm) { body.scrollTop = 0; $("#evTitle").focus(); }
    else {
      const firstHour = events.length ? Number(String(events[0].start_time).slice(0, 2)) : 7;
      const row = $("#h" + firstHour);
      if (row) body.scrollTop = row.offsetTop - body.offsetTop - 8;
    }
  }

  /* ---- Meals: breakfast / lunch / dinner ---- */
  function renderMeals(openSlot) {
    const { key } = current;
    const dayMeals = data.meals.filter(m => m.meal_date === key).sort(byCreated);
    body.innerHTML = MEAL_SLOTS.map(s => {
      const meals = dayMeals.filter(m => m.meal_type === s.type);
      return `
        <div class="meal" data-slot="${s.key}">
          <div class="meal-head">
            <h4><span class="swatch" style="background:${s.color}"></span>${s.name}</h4>
            <button class="btn ghost small add-meal">+ Add</button>
          </div>
          ${meals.length ? "" : `<div class="meal-empty">Nothing planned.</div>`}
          <div style="display:flex;flex-direction:column;gap:6px">
            ${meals.map(m => `
              <div class="event" data-id="${esc(m.id)}">
                <div class="ev-main">
                  <div class="ev-title">${esc(m.title)}</div>
                  ${m.notes ? `<div class="ev-desc">${esc(m.notes)}</div>` : ""}
                </div>
                <button class="del" aria-label="Delete meal">&times;</button>
              </div>`).join("")}
          </div>
          <form class="form ${openSlot === s.key ? "open" : ""}">
            <div class="field"><label>Meal</label><input name="title" required placeholder="e.g. Chicken tacos"></div>
            <div class="field"><label>Notes / recipe</label><textarea name="desc" placeholder="Link, prep notes, who's cooking…"></textarea></div>
            <div class="field"><label>Ingredients (one per line)</label><textarea name="ing" placeholder="tortillas&#10;chicken thighs&#10;limes"></textarea></div>
            <label class="check"><input type="checkbox" name="toGrocery" checked> Add ingredients to the Grocery list</label>
            <p class="err"></p>
            <div style="display:flex;gap:8px;justify-content:flex-end">
              <button type="button" class="btn ghost cancel">Cancel</button>
              <button type="submit" class="btn save">Save ${s.name.toLowerCase()}</button>
            </div>
          </form>
        </div>`;
    }).join("");
    actions.innerHTML = `<button class="btn ghost" id="doneMeals">Done</button>`;
    $("#doneMeals").onclick = closeDay;

    body.querySelectorAll(".meal").forEach(section => {
      const slot = MEAL_SLOTS.find(s => s.key === section.dataset.slot);
      const form = $("form", section);
      $(".add-meal", section).onclick = () => renderMeals(slot.key);
      $(".cancel", section).onclick = () => renderMeals();
      form.onsubmit = async e => {
        e.preventDefault();
        const title = form.title.value.trim();
        if (!title) { $(".err", form).textContent = "Give the meal a name."; return; }
        const ing = form.ing.value.trim();
        const toGrocery = form.toGrocery.checked;
        $(".save", form).disabled = true;
        const rows = await run(sb.from("meal_plans").insert({
          meal_date: key, meal_type: slot.type, title,
          notes: form.desc.value.trim() || null, ingredients: ing || null
        }).select());
        if (!rows) { $(".save", form).disabled = false; return; }
        rows.forEach(r => upsert(data.meals, r));
        let added = 0;
        if (ing && toGrocery && rows[0]) added = await addItems("grocery", ing, { meal_plan_id: rows[0].id });
        if (current) { renderCalendar(current.cal); renderMeals(); }
        toast(added ? `Saved · ${added} ingredient${added === 1 ? "" : "s"} added to Grocery` : "Meal saved");
      };
      section.querySelectorAll(".event .del").forEach(btn => btn.onclick = async () => {
        const id = btn.closest(".event").dataset.id;
        data.meals = data.meals.filter(m => m.id !== id);
        renderMeals();
        renderCalendar(current.cal);
        await run(sb.from("meal_plans").delete().eq("id", id));
      });
    });
    if (openSlot) {
      const f = body.querySelector(`.meal[data-slot="${openSlot}"] input[name=title]`);
      if (f) { f.focus(); f.scrollIntoView({ block: "nearest" }); }
    }
  }

  /* ================= Sign in / out ================= */
  const login = $("#login"), loginForm = $("#loginForm");
  let loginMode = "signin"; // or "reset" (setting a new password after a reset email)
  let started = false;

  function showLogin(mode) {
    loginMode = mode || "signin";
    const reset = loginMode === "reset";
    $("#loginSub").textContent = reset ? "Choose a new password." : "Sign in to see your lists and calendars.";
    $("#emailField").style.display = reset ? "none" : "";
    $("#loginEmail").required = !reset;
    $("#pwLabel").textContent = reset ? "New password" : "Password";
    $("#loginPassword").autocomplete = reset ? "new-password" : "current-password";
    $("#loginBtn").textContent = reset ? "Save password" : "Sign in";
    $("#forgotBtn").style.display = reset ? "none" : "";
    $("#loginErr").textContent = "";
    $("#loginPassword").value = "";
    login.classList.add("open");
    $("#appHeader").classList.add("hidden");
    $("#appMain").classList.add("hidden");
  }

  loginForm.addEventListener("submit", async e => {
    e.preventDefault();
    const btn = $("#loginBtn");
    $("#loginErr").textContent = ""; $("#loginMsg").textContent = "";
    btn.disabled = true;
    let error;
    if (loginMode === "reset") {
      ({ error } = await sb.auth.updateUser({ password: $("#loginPassword").value }));
      if (!error) { loginMode = "signin"; toast("Password updated"); startApp(); }
    } else {
      ({ error } = await sb.auth.signInWithPassword({
        email: $("#loginEmail").value.trim(), password: $("#loginPassword").value
      }));
    }
    btn.disabled = false;
    if (error) $("#loginErr").textContent = error.message === "Invalid login credentials" ? "Email or password is incorrect." : error.message;
  });

  $("#forgotBtn").addEventListener("click", async () => {
    const email = $("#loginEmail").value.trim();
    $("#loginErr").textContent = ""; $("#loginMsg").textContent = "";
    if (!email) { $("#loginErr").textContent = "Type your email above first."; return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (error) $("#loginErr").textContent = error.message;
    else $("#loginMsg").textContent = "Check your email for a reset link.";
  });

  $("#signOutBtn").addEventListener("click", () => sb.auth.signOut());

  async function startApp() {
    login.classList.remove("open");
    $("#appHeader").classList.remove("hidden");
    $("#appMain").classList.remove("hidden");
    if (started) return;
    started = true;
    $("#loading").style.display = "";
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    await loadAll();
    $("#loading").style.display = "none";
    setTab(prefGet("planner-tab", "household") === "meals" ? "meals" : "household");
    renderAll();
    subscribe();
  }

  function stopApp() {
    started = false;
    if (channel) { sb.removeChannel(channel); channel = null; }
    Object.keys(data).forEach(k => data[k] = []);
    renderAll();
    if (overlay.classList.contains("open")) closeDay();
    showLogin("signin");
  }

  // Build the UI once (empty), then fill it after sign-in
  document.querySelectorAll("[data-list]").forEach(buildList);
  document.querySelectorAll("[data-calendar]").forEach(buildCalendar);

  sb.auth.onAuthStateChange((event, session) => {
    // Supabase recommends not awaiting other Supabase calls inside this callback
    setTimeout(() => {
      if (event === "PASSWORD_RECOVERY") showLogin("reset");
      else if (event === "SIGNED_OUT" || !session) stopApp();
      else if (loginMode !== "reset") startApp();
    }, 0);
  });
})();
</script>
</body>
</html>
